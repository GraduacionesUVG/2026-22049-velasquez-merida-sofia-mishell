[project]
name = "coherence-analysis-mcp"
version = "0.1.0"
description = "MCP de analisis de coherencia interna para deteccion de phishing"
readme = "README.md"
authors = [
    { name = "Sofiamishel2003", email = "sofiamishel2003@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0",
    "pydantic>=2.0.0",
    "anthropic>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
coherence-analysis-mcp = "coherence_analysis_mcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
